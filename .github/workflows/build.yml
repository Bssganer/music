name: Android APK Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk_uret:
    runs-on: ubuntu-latest
    steps:
      - name: Depo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Eksik Android Platform Dosyalarini Tamamla ve APK Olustur
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --org com.auramuzik.app --platforms android .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          flutter pub get
          flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AuraMuzik-APK
          path: build/app/outputs/flutter-apk/app-release.apk
